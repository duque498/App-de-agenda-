<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: o app ocupa até atrás do notch; safe-area é tratada no CSS -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Agenda</title>
    <meta name="theme-color" content="#0d1118" />

    <!-- PWA -->
    <link rel="manifest" href="/App-de-agenda-/manifest.webmanifest" />

    <!-- iOS: sem essas tags o Safari não trata como app na tela de início -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agenda" />
    <link rel="apple-touch-icon" href="/App-de-agenda-/icons/icon-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
